<!DOCTYPE html>
<html lang="es" class="h-full bg-indigo-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerrar sesión | STOCKORA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="h-full flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center mb-4">
        <svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#7c3aed"/>
            </linearGradient>
          </defs>
          <rect width="72" height="72" rx="18" fill="url(#lg)"/>
          <rect x="14" y="44" width="10" height="16" rx="3" fill="white" opacity="0.7"/>
          <rect x="30" y="32" width="10" height="28" rx="3" fill="white" opacity="0.85"/>
          <rect x="46" y="18" width="10" height="42" rx="3" fill="white"/>
          <circle cx="51" cy="12" r="4" fill="#a5b4fc"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">STOCKORA</h1>
      <p class="text-indigo-300 mt-1">Sistema de gestión de inventario</p>
    </div>

    <!-- Tarjeta -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 text-center">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-red-100 rounded-full mb-4">
        <i class="fa-solid fa-right-from-bracket text-red-500 text-xl"></i>
      </div>
      <h2 class="text-xl font-semibold text-gray-800 mb-2">¿Cerrar sesión?</h2>
      <p class="text-sm text-gray-500 mb-6">Serás redirigido a la página de inicio de sesión.</p>

      <form method="POST" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit"
                class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-2.5 rounded-lg transition-colors duration-150 mb-3">
          <i class="fa-solid fa-right-from-bracket mr-2"></i> Cerrar sesión
        </button>
      </form>

      <a href="javascript:history.back()"
         class="block w-full text-center border border-gray-200 hover:bg-gray-50 text-gray-600 font-medium py-2.5 rounded-lg transition-colors duration-150 text-sm">
        Cancelar
      </a>
    </div>
  </div>

</body>
</html>
