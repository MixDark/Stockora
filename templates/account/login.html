<!DOCTYPE html>
<html lang="es" class="h-full bg-indigo-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Stockora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="h-full flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center mb-4">
        <svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#7c3aed"/>
            </linearGradient>
          </defs>
          <rect width="72" height="72" rx="18" fill="url(#lg)"/>
          <rect x="14" y="44" width="10" height="16" rx="3" fill="white" opacity="0.7"/>
          <rect x="30" y="32" width="10" height="28" rx="3" fill="white" opacity="0.85"/>
          <rect x="46" y="18" width="10" height="42" rx="3" fill="white"/>
          <circle cx="51" cy="12" r="4" fill="#a5b4fc"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">STOCKORA</h1>
      <p class="text-indigo-300 mt-1">Sistema de gestión de inventario</p>
    </div>

    <!-- Tarjeta de login -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <h2 class="text-xl font-semibold text-gray-800 mb-6 text-center">Inicio de sesión</h2>

      {% if form.errors %}
      <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-5">
        Usuario o contraseña incorrectos. Por favor inténtalo de nuevo.
      </div>
      {% endif %}

      <form method="POST" action="{% url 'account_login' %}" class="space-y-4">
        {% csrf_token %}

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" name="login" autocomplete="username" required
                   class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" name="password" autocomplete="current-password" required
                   class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
          </div>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
            <input type="checkbox" name="remember" class="rounded border-gray-300 text-indigo-600">
            Recordarme
          </label>
          <a href="{% url 'account_reset_password' %}" class="text-sm text-indigo-600 hover:text-indigo-800">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <input type="hidden" name="next" value="{{ next }}">

        <div class="flex justify-center">
          <button type="submit"
                  class="w-1/3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-right-to-bracket"></i> Ingresar
          </button>
        </div>
      </form>
    </div>

    <p class="text-center text-indigo-400 text-xs mt-6">
      &copy; 2026 Stockora. Todos los derechos reservados.
    </p>
  </div>

</body>
</html>
