{% extends 'base.html' %}

{% block title %}Editar stock{% endblock %}
{% block page_title %}Editar stock{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <form method="POST" class="space-y-5">
      {% csrf_token %}

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Producto</label>
          <input type="text" value="{{ item.product.name }}" disabled
                 class="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2.5 text-sm text-gray-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Almacén</label>
          <input type="text" value="{{ item.warehouse.name }}" disabled
                 class="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2.5 text-sm text-gray-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad</label>
          <input type="number" name="quantity" value="{{ item.quantity }}" min="0"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad reservada</label>
          <input type="number" name="reserved_quantity" value="{{ item.reserved_quantity }}" min="0"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Ubicación</label>
        <input type="text" name="location" 
               value="{% if item.location %}{{ item.location.code }}{% endif %}"
               placeholder="Pasillo estante nivel"
               class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        <p class="text-xs text-gray-400 mt-1">Formato: Pasillo-Estante-Nivel</p>
      </div>

      <div class="flex justify-center gap-3 pt-2">
        <a href="{% url 'inventory:stock' %}"
           class="px-8 text-center py-2.5 rounded-lg text-sm font-medium btn-cancel transition-colors flex items-center justify-center gap-2">
          <i class="fa-solid fa-xmark"></i> Cancelar
        </a>
        <button type="submit"
                class="px-8 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2">
          <i class="fa-solid fa-floppy-disk"></i> Guardar
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
